[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scalix-sdk"
version = "1.3.4"
description = "The official client for Scalix Cloud — one token for AI inference, database, functions, storage, KV, auth, and every platform service. Generated from the OpenAPI spec."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Scalix World", email = "sdk@scalix.world" },
]
keywords = [
    "ai",
    "llm",
    "sdk",
    "scalix",
    "chat",
    "tts",
    "rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "attrs>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.18",
    "mypy>=1.13.0",
]

[project.urls]
Homepage = "https://scalix.world"
Documentation = "https://docs.scalix.world/sdks/python"
Repository = "https://github.com/scalixworld/scalix-world-sdk"
Issues = "https://github.com/scalixworld/scalix-cloud/issues"

[tool.hatch.build.targets.wheel]
packages = ["scalix_sdk"]
# Cutover complete: the hand-written ("gcp-era") client is removed; the package now
# ships the generated openapi-python-client (scalix_sdk/generated/, attrs+httpx).
# Regenerate with scripts/generate.sh; the codegen drift-guard validates it vs
# sdk/openapi.json.

[tool.ruff]
target-version = "py310"
line-length = 100
# Machine-generated client (openapi-python-client) — style is the generator's
# concern and the codegen drift-guard already validates it against
# sdk/openapi.json. Linting it is pure noise (1,200+ findings).
extend-exclude = ["scalix_sdk/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
# Hand-written hardening-layer tests (the generated client ships none). asyncio_mode
# = auto lets async test functions run without a per-test decorator.
asyncio_mode = "auto"
testpaths = ["tests"]
