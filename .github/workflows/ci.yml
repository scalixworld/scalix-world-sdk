name: Home server checks

on:
  push:
    branches: [main, ci/home-server-checks]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: ${{ matrix.package }} / ${{ matrix.check }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, scalix-ci]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: typescript
            check: lint
          - package: typescript
            check: typecheck
          - package: typescript
            check: test:unit
          - package: typescript
            check: build
          - package: auth
            check: check
          - package: auth
            check: test:unit
          - package: auth
            check: build
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run ${{ matrix.check }}
      - if: matrix.check == 'build'
        run: npm pack --dry-run --ignore-scripts

  python:
    name: python / ${{ matrix.check }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, scalix-ci]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            command: uv run --frozen --extra dev ruff check .
          - check: typecheck
            command: uv run --frozen --extra dev mypy scalix_sdk
          - check: test
            command: uv run --frozen --extra dev pytest
          - check: build
            command: uv build
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.10.7'
          python-version: '3.13'
          enable-cache: false
      - run: uv sync --frozen --extra dev
      - run: ${{ matrix.command }}
